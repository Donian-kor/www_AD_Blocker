<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>www_AD_Blocker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:360px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4f6fb;color:#1e293b;padding:16px}
.header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #dbe2ee}
.header img{width:32px;height:32px}
.header h1{font-size:15px;font-weight:700;color:#0f172a}
.header .badge{font-size:10px;background:#e94560;color:white;padding:2px 6px;border-radius:10px;margin-left:auto}

.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px;margin-bottom:12px;border:2px solid #16a34a;border-radius:8px}
.toggle-row.off{border-color:#94a3b8}
.toggle-status{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:#16a34a}
.toggle-row.off .toggle-status{color:#94a3b8}
.toggle-status .dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.toggle{position:relative;width:44px;height:24px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#94a3b8;border-radius:24px;transition:.3s}
.slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
input:checked+.slider{background:#16a34a}
input:checked+.slider:before{transform:translateX(20px)}

/* 토글 상태는 .toggle-status 사용 */

/* 통계 - 배경 박스 없이 텍스트만 */
.page-stat{text-align:center;margin-bottom:8px;padding:8px 0}
.page-stat .number{font-size:42px;font-weight:800;color:#e94560;line-height:1.1}
.page-stat .label{font-size:11px;color:#64748b;margin-top:6px}

.total-row{display:flex;align-items:center;gap:8px;background:#fff;border-radius:8px;padding:9px 12px;margin-bottom:12px;border:1px solid #dbe2ee;cursor:pointer;font-size:11px;color:#64748b;transition:border-color .2s}
.total-row:hover{border-color:#e94560}
.total-row .total-label{font-weight:700;color:#0f172a}
.total-row .total-number{font-size:14px;font-weight:700;color:#e94560}
.total-row .total-hint{margin-left:auto;font-size:10px;color:#94a3b8}

/* 이 사이트 광고 허용 (허용 목록) */
.site-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;margin-bottom:12px;border:1px solid #dbe2ee;border-radius:8px;background:#fff}
.site-row.hidden{display:none}
.site-row.on{border-color:#16a34a}
.site-text{min-width:0}
.site-title{font-size:11px;font-weight:700;color:#0f172a}
.site-host{font-size:10px;color:#64748b;word-break:break-all;margin-top:2px}
.site-note{font-size:10px;color:#94a3b8;margin-top:2px}

.actions{display:flex;gap:8px;margin-bottom:8px}
.pick-row{margin-bottom:10px}
.pick-row button{width:100%}
button{flex:1;padding:9px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .2s}
button:hover{opacity:.85}
button.secondary{background:#e8edf5;color:#1e293b}
button.primary{background:#2563eb;color:white}

.footer{font-size:10px;color:#94a3b8;text-align:center;padding-top:10px;border-top:1px solid #dbe2ee}
</style>
</head>
<body>
<div class="header">
<img src="icon48.png" alt="icon">
<h1>www_AD_Blocker</h1>
<span class="badge">v0.37</span>
</div>

<div class="toggle-row">
<span class="toggle-status" id="toggleStatus"><span class="dot"></span><span id="toggleStatusText">광고 차단 중</span></span>
<label class="toggle">
<input type="checkbox" id="enabledToggle" checked>
<span class="slider"></span>
</label>
</div>

<div class="site-row hidden" id="siteRow">
<div class="site-text">
<div class="site-title">이 사이트 광고 허용</div>
<div class="site-host" id="siteHost">-</div>
<div class="site-note" id="siteNote"></div>
</div>
<label class="toggle">
<input type="checkbox" id="siteToggle">
<span class="slider"></span>
</label>
</div>

<div class="page-stat" id="pageStat">
<div class="number" id="pageBlocked">0</div>
<div class="label">현재 사이트 누적 차단</div>
</div>

<div class="total-row" id="totalCard" title="클릭하면 설정 페이지의 차단 기록을 엽니다">
<span class="total-label">총 차단</span>
<span class="total-number" id="totalBlocked">0</span>
<span class="total-hint">기록 보기 →</span>
</div>

<div class="actions">
<button class="secondary" id="resetBtn">통계 초기화</button>
<button class="primary" id="optionsBtn">설정</button>
</div>
<div class="pick-row">
<button class="secondary" id="pickBtn">🎯 요소 차단 모드</button>
</div>

<div class="footer">
광고·트래커 차단 확장 프로그램
</div>

<script src="shared/allowlist.js"></script>
<script src="popup.js"></script>
</body>
</html>
